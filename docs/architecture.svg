<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 760" style="background:#0d1117;font-family:ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ═══ SECTION LABELS ═══════════════════════════════════════════ -->
  <text x="450" y="22" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">CLIENT</text>
  <text x="450" y="148" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">API GATEWAY</text>
  <text x="450" y="278" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">LANGGRAPH PIPELINE</text>
  <text x="450" y="508" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">LLM ROUTER</text>
  <text x="175" y="508" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">SEARCH</text>
  <text x="725" y="508" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">RESPONSE</text>

  <!-- ─── Horizontal dividers ────────────────────────────────────── -->
  <line x1="40" y1="130" x2="860" y2="130" stroke="#21262d" stroke-width="1"/>
  <line x1="40" y1="260" x2="860" y2="260" stroke="#21262d" stroke-width="1"/>
  <line x1="40" y1="490" x2="860" y2="490" stroke="#21262d" stroke-width="1"/>
  <line x1="40" y1="640" x2="860" y2="640" stroke="#21262d" stroke-width="1"/>

  <!-- ═══ ROW 0 — CLIENT ════════════════════════════════════════════ -->
  <!-- HTTP Client -->
  <rect x="160" y="32" width="180" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="250" y="52" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">HTTP Client</text>
  <text x="250" y="69" text-anchor="middle" font-size="10" fill="#8b949e">cURL · Postman · Frontend</text>
  <!-- Swagger UI -->
  <rect x="380" y="32" width="180" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">Swagger UI</text>
  <text x="470" y="69" text-anchor="middle" font-size="10" fill="#8b949e">GET /docs</text>
  <!-- ReDoc -->
  <rect x="600" y="32" width="140" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="670" y="52" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">ReDoc</text>
  <text x="670" y="69" text-anchor="middle" font-size="10" fill="#8b949e">GET /redoc</text>

  <!-- arrows client → gateway -->
  <line x1="250" y1="78" x2="400" y2="158" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="470" y1="78" x2="450" y2="158" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="670" y1="78" x2="510" y2="158" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ═══ ROW 1 — FASTAPI GATEWAY ══════════════════════════════════ -->
  <rect x="80" y="158" width="740" height="60" rx="10" fill="#1a1f6e" stroke="#3b41c5" stroke-width="1.3"/>
  <text x="450" y="181" text-anchor="middle" font-size="13" fill="#a5b4fc" font-weight="700">FastAPI application</text>
  <text x="450" y="200" text-anchor="middle" font-size="10" fill="#818cf8">CORS middleware · lifespan · global error handler · request logging · /health · /api/v1/research/generate</text>

  <!-- arrow gateway → pipeline -->
  <line x1="450" y1="218" x2="450" y2="288" stroke="#818cf8" stroke-width="1.3" marker-end="url(#arr-b)"/>

  <!-- ═══ ROW 2 — LANGGRAPH PIPELINE ═══════════════════════════════ -->
  <!-- Pipeline container (dashed) -->
  <rect x="80" y="288" width="740" height="190" rx="12" fill="none" stroke="#2d333b" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="90" y="308" font-size="10" fill="#484f58" font-weight="600">LangGraph StateGraph</text>

  <!-- Node 1: Researcher -->
  <rect x="110" y="318" width="190" height="70" rx="8" fill="#0d2d1a" stroke="#238636" stroke-width="1.2"/>
  <text x="205" y="342" text-anchor="middle" font-size="13" fill="#3fb950" font-weight="700">① Researcher</text>
  <text x="205" y="360" text-anchor="middle" font-size="10" fill="#56d364">researcher_node(state)</text>
  <text x="205" y="376" text-anchor="middle" font-size="10" fill="#2ea043">Tavily web search</text>

  <!-- Node 2: Synthesizer -->
  <rect x="355" y="318" width="190" height="70" rx="8" fill="#1a1f6e" stroke="#3b41c5" stroke-width="1.2"/>
  <text x="450" y="342" text-anchor="middle" font-size="13" fill="#a5b4fc" font-weight="700">② Synthesizer</text>
  <text x="450" y="360" text-anchor="middle" font-size="10" fill="#818cf8">synthesizer_node(state)</text>
  <text x="450" y="376" text-anchor="middle" font-size="10" fill="#6366f1">LLM summarization</text>

  <!-- Node 3: Report Builder -->
  <rect x="600" y="318" width="200" height="70" rx="8" fill="#2d1a00" stroke="#f0883e" stroke-width="1.2"/>
  <text x="700" y="342" text-anchor="middle" font-size="13" fill="#ffa657" font-weight="700">③ Report Builder</text>
  <text x="700" y="360" text-anchor="middle" font-size="10" fill="#d29922">report_builder_node(state)</text>
  <text x="700" y="376" text-anchor="middle" font-size="10" fill="#b45309">LLM report generation</text>

  <!-- Pipeline arrows -->
  <line x1="300" y1="353" x2="353" y2="353" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="545" y1="353" x2="598" y2="353" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- State flow label -->
  <rect x="110" y="406" width="690" height="58" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="195" y="424" text-anchor="middle" font-size="10" fill="#8b949e" font-weight="600">AgentState</text>
  <line x1="230" y1="420" x2="230" y2="456" stroke="#30363d" stroke-width="1"/>
  <text x="260" y="424" font-size="10" fill="#56d364">query: str</text>
  <text x="260" y="440" font-size="10" fill="#56d364">search_results: List</text>
  <text x="260" y="456" font-size="10" fill="#56d364">sources: List</text>
  <line x1="420" y1="420" x2="420" y2="456" stroke="#30363d" stroke-width="1"/>
  <text x="432" y="424" font-size="10" fill="#818cf8">summary: str</text>
  <line x1="580" y1="420" x2="580" y2="456" stroke="#30363d" stroke-width="1"/>
  <text x="592" y="424" font-size="10" fill="#ffa657">final_report: str</text>

  <!-- ═══ ROW 3 — LLM ROUTER + SEARCH + RESPONSE ═══════════════════ -->

  <!-- Tavily Search (left) -->
  <rect x="60" y="518" width="230" height="90" rx="10" fill="#0d2d1a" stroke="#238636" stroke-width="1.2"/>
  <text x="175" y="542" text-anchor="middle" font-size="13" fill="#3fb950" font-weight="700">Tavily AI Search</text>
  <text x="175" y="560" text-anchor="middle" font-size="10" fill="#56d364">search_web(query)</text>
  <text x="175" y="578" text-anchor="middle" font-size="10" fill="#2ea043">depth: advanced</text>
  <text x="175" y="594" text-anchor="middle" font-size="10" fill="#2ea043">max_results: 5</text>

  <!-- LLM Router (center) -->
  <rect x="320" y="518" width="260" height="90" rx="10" fill="#1c1c1c" stroke="#484f58" stroke-width="1.2"/>
  <text x="450" y="542" text-anchor="middle" font-size="13" fill="#c9d1d9" font-weight="700">LLM Router</text>
  <text x="450" y="560" text-anchor="middle" font-size="10" fill="#8b949e">llm_router.generate(prompt)</text>
  <!-- Groq pill -->
  <rect x="335" y="570" width="100" height="26" rx="5" fill="#0d2d1a" stroke="#238636" stroke-width="1"/>
  <text x="385" y="587" text-anchor="middle" font-size="10" fill="#3fb950" font-weight="600">① Groq</text>
  <!-- OpenAI pill -->
  <rect x="465" y="570" width="100" height="26" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="515" y="587" text-anchor="middle" font-size="10" fill="#8b949e" font-weight="600">② OpenAI ↩</text>

  <!-- Response (right) -->
  <rect x="610" y="518" width="250" height="90" rx="10" fill="#1a1000" stroke="#d29922" stroke-width="1.2"/>
  <text x="735" y="542" text-anchor="middle" font-size="13" fill="#f0c040" font-weight="700">ReportResponse</text>
  <text x="735" y="560" text-anchor="middle" font-size="10" fill="#c9a02a">report: str (markdown)</text>
  <text x="735" y="576" text-anchor="middle" font-size="10" fill="#c9a02a">summary: str</text>
  <text x="735" y="592" text-anchor="middle" font-size="10" fill="#c9a02a">sources: List[Source]</text>

  <!-- Arrows: researcher → tavily -->
  <line x1="180" y1="388" x2="175" y2="516" stroke="#238636" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <!-- Arrows: synthesizer + report_builder → LLM router -->
  <line x1="450" y1="388" x2="450" y2="516" stroke="#3b41c5" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-b)"/>
  <line x1="700" y1="388" x2="530" y2="516" stroke="#f0883e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-o)"/>
  <!-- Arrow: pipeline → response -->
  <line x1="780" y1="388" x2="760" y2="516" stroke="#d29922" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ═══ ROW 4 — PROVIDERS ══════════════════════════════════════════ -->
  <text x="450" y="656" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">LLM PROVIDERS</text>

  <!-- Groq provider -->
  <rect x="220" y="664" width="200" height="58" rx="8" fill="#0d2d1a" stroke="#238636" stroke-width="1.2"/>
  <text x="320" y="686" text-anchor="middle" font-size="12" fill="#3fb950" font-weight="600">Groq</text>
  <text x="320" y="704" text-anchor="middle" font-size="10" fill="#56d364">llama-3.3-70b-versatile</text>
  <text x="320" y="718" text-anchor="middle" font-size="10" fill="#2ea043">Primary · fast · free tier</text>

  <!-- OpenAI provider -->
  <rect x="480" y="664" width="200" height="58" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="580" y="686" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">OpenAI</text>
  <text x="580" y="704" text-anchor="middle" font-size="10" fill="#8b949e">gpt-4o-mini</text>
  <text x="580" y="718" text-anchor="middle" font-size="10" fill="#484f58">Fallback · auto-triggered</text>

  <!-- Arrows: router → providers -->
  <line x1="400" y1="608" x2="340" y2="662" stroke="#238636" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="500" y1="608" x2="560" y2="662" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- Prompts note -->
  <rect x="60" y="664" width="140" height="58" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="130" y="686" text-anchor="middle" font-size="11" fill="#8b949e" font-weight="600">Prompt files</text>
  <text x="130" y="703" text-anchor="middle" font-size="10" fill="#484f58">prompts/</text>
  <text x="130" y="718" text-anchor="middle" font-size="10" fill="#484f58">synthesizer.md</text>
  <line x1="205" y1="388" x2="130" y2="662" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- report_builder.md -->
  <rect x="700" y="664" width="160" height="58" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="780" y="686" text-anchor="middle" font-size="11" fill="#8b949e" font-weight="600">Prompt files</text>
  <text x="780" y="703" text-anchor="middle" font-size="10" fill="#484f58">prompts/</text>
  <text x="780" y="718" text-anchor="middle" font-size="10" fill="#484f58">report_builder.md</text>
  <line x1="710" y1="388" x2="780" y2="662" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>

</svg>
